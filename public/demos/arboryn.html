<!DOCTYPE html>
<html lang="en" class="t-violet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arboryn merge demo</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="demo">
  <p class="help">Click a cell in Ours or Theirs to toggle whether that side changed the value. Where both sides changed it differently, the merge stops and asks.</p>
  <div class="tablewrap">
    <table class="merge" id="mg">
      <thead><tr><th scope="col">Property</th><th scope="col">Base</th><th scope="col">Ours</th><th scope="col">Theirs</th><th scope="col">Merged</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="controls" style="margin-top:10px"><p class="readout" id="mg-sum" style="margin:0">&nbsp;</p><button id="mg-reset" class="small" type="button">Reset</button></div>
  <p class="note">Concept demo. The merge engine is planned and not built yet; today the repository is the Phase 0 capture harness.</p>
</div>
<script src="common.js"></script>
<script src="arboryn.js"></script>
</body>
</html>
